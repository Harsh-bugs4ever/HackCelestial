services:
  - type: web
    name: smart-resort-360-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed.generate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REDIS_URL
        value: ""
      - key: LLM_MODEL
        value: "claude-opus-5"
      - key: FORECAST_HORIZON_DAYS
        value: "30"
