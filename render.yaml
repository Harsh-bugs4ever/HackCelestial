services:
  - type: web
    name: smart-resort-360-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    # Seeding at build time bakes the SQLite demo dataset into the instance
    # image. --reset forces a rebuild so every deploy starts from fresh data.
    buildCommand: pip install -r requirements.txt && python -m app.seed.generate --reset
    # One worker: the free instance has 512MB and the WebSocket hub is in-process,
    # so a second worker would fan out to only half the connected dashboards.
    # Nothing slow belongs here - the host scans for an open port and gives up
    # if the server has not bound one, so seeding must stay in the build step.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Empty -> the broker check fails instantly and Celery runs eager in-process.
      - key: REDIS_URL
        value: ""
      - key: LLM_MODEL
        value: "claude-opus-5"
      - key: FORECAST_HORIZON_DAYS
        value: "30"
      # Set in the Render dashboard. Unset -> grounded extractive fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Self-ping every 10 min so the free instance never hits the ~15 min idle
      # timeout and its ~50s cold start. The target comes from
      # RENDER_EXTERNAL_URL, which Render injects. "false" lets it sleep.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "600"
