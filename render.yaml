services:
  - type: web
    name: smart-resort-360-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    # Seeding at build time bakes the SQLite demo dataset into the instance image.
    buildCommand: pip install -r requirements.txt && python -m app.seed.generate
    # One worker: the free instance has 512MB and the WebSocket hub is in-process,
    # so a second worker would fan out to only half the connected dashboards.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Empty -> the broker check fails instantly and Celery runs eager in-process.
      - key: REDIS_URL
        value: ""
      - key: LLM_MODEL
        value: "claude-opus-5"
      - key: FORECAST_HORIZON_DAYS
        value: "30"
      # Set in the Render dashboard. Unset -> grounded extractive fallback.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Self-ping every 10 min so the free instance never hits the ~15 min idle
      # timeout and its ~50s cold start. The target comes from
      # RENDER_EXTERNAL_URL, which Render injects. "false" lets it sleep.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "600"
      # Identity. Set this in the Render dashboard before sharing the URL:
      # without it anyone who can reach the service can approve a rate change
      # or raise a purchase order, and /health reports auth as DISABLED.
      # Format: "token:Display Name:role" triples, comma-separated.
      - key: AUTH_USERS
        sync: false
      # The operating day is resolved here, not in the server's UTC.
      - key: RESORT_TIMEZONE
        value: "Asia/Kolkata"
      # Trust ramp: "true" records and previews approvals without writing.
      - key: SHADOW_MODE
        value: "false"
      - key: UNDO_WINDOW_MINUTES
        value: "30"
      # Notification channels. "console" only logs - switch to email/whatsapp
      # and add the credentials below to actually reach staff and suppliers.
      - key: NOTIFY_CHANNELS
        value: "console"
      - key: DUTY_MANAGER_EMAIL
        sync: false
      - key: DUTY_MANAGER_PHONE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
