name: CI

# The backend already had 17 good regression tests - concurrent approvals,
# executor rollback, cache races - and nothing ran them. A test suite that only
# runs when someone remembers to run it protects nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the light runtime set
        # Deliberately not requirements-ml.txt: every heavy import is lazy and
        # guarded, and CI should prove the fallbacks work on the same dependency
        # set the free tier actually deploys.
        run: pip install -r requirements.txt

      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Seed and smoke test
        # The smoke test executes recommendations, so it runs against a
        # throwaway database rather than a committed one.
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/smoke.db
        run: |
          python -m app.seed.generate
          python -m scripts.smoke

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        # NEXT_PUBLIC_API_BASE is inlined at build time; CI only needs the build
        # to succeed, so a placeholder is correct here.
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: npm run build
