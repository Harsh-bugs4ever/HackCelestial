# Wakes the Render backend from outside the instance.
#
# The app also self-pings (backend/app/core/keepalive.py), but that only works
# while it is running - once Render has already put a free instance to sleep,
# something external has to knock. This cron does that, and it is also what
# recovers the service after a deploy, a crash, or a missed self-ping.
#
# Setup: add a repository variable named BACKEND_URL (Settings -> Secrets and
# variables -> Actions -> Variables) holding the Render service URL, e.g.
# https://smart-resort-360-api.onrender.com
#
# Note: GitHub disables scheduled workflows in repositories with no activity
# for 60 days, and busy periods can delay a cron by several minutes - which is
# exactly why the in-process self-ping exists alongside it.
name: keep-alive

on:
  schedule:
    # Every 10 minutes - comfortably inside Render's ~15 minute idle timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# A slow cold start must never leave two runs racing each other.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -u
          if [ -z "${BACKEND_URL}" ]; then
            echo "::warning::Repository variable BACKEND_URL is not set - nothing to ping."
            exit 0
          fi
          url="${BACKEND_URL%/}/health"
          # A sleeping instance takes ~50s to boot, so the first attempt is
          # allowed to be slow; the retries cover a boot that runs long.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 120 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "awake (HTTP $code) on attempt $attempt"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done
          echo "::error::$url did not return 200 after 5 attempts"
          exit 1
